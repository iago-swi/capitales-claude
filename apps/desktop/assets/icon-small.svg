<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    The 16-32px variant. At taskbar size the graticule turns to mud, the outer
    ring closes into a smudge and the ticks disappear, so this keeps only what
    survives: navy ground, one heavy ring, one solid brass dot — both enlarged
    so the shape still reads at a glance.
  -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#24507d" />
      <stop offset="1" stop-color="#0c1e38" />
    </linearGradient>
    <clipPath id="round">
      <rect width="512" height="512" rx="104" ry="104" />
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#ground)" />
    <circle cx="256" cy="256" r="146" fill="none" stroke="#f0c163" stroke-width="38" />
    <circle cx="256" cy="256" r="76" fill="#f0c163" />
  </g>
</svg>
