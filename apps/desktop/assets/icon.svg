<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    The survey benchmark: the same motif the game paints on every capital, and
    the same one the wordmark carries. Navy chart ground, brass marker.
  -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1a3757" />
      <stop offset="0.55" stop-color="#0a1628" />
      <stop offset="1" stop-color="#060f1c" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8b54b" stop-opacity="0.42" />
      <stop offset="0.6" stop-color="#e8b54b" stop-opacity="0.10" />
      <stop offset="1" stop-color="#e8b54b" stop-opacity="0" />
    </radialGradient>
    <clipPath id="round">
      <rect width="512" height="512" rx="104" ry="104" />
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#ground)" />

    <!-- Graticule, deliberately faint: texture at 256px, invisible at 32. -->
    <g stroke="#1b3557" stroke-width="2" opacity="0.9">
      <path d="M64 0V512M128 0V512M192 0V512M256 0V512M320 0V512M384 0V512M448 0V512" />
      <path d="M0 64H512M0 128H512M0 192H512M0 256H512M0 320H512M0 384H512M0 448H512" />
    </g>

    <circle cx="256" cy="256" r="170" fill="url(#glow)" />

    <!-- Outer ring, quarter-cut so it reads as an instrument, not a target. -->
    <g fill="none" stroke="#e8b54b" stroke-linecap="round">
      <circle cx="256" cy="256" r="112" stroke-width="7" opacity="0.38" />
      <circle cx="256" cy="256" r="66" stroke-width="10" opacity="0.78" />
    </g>

    <g stroke="#e8b54b" stroke-width="10" stroke-linecap="round" opacity="0.85">
      <path d="M256 108V150" />
      <path d="M256 362V404" />
      <path d="M108 256H150" />
      <path d="M362 256H404" />
    </g>

    <circle cx="256" cy="256" r="32" fill="#e8b54b" />
  </g>
</svg>
